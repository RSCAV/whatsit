name: Release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: macos-14
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no token is ever stored
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./build_helper.sh
      - run: uv build --wheel
      - run: uv build --sdist
      - uses: pypa/gh-action-pypi-publish@release/v1
